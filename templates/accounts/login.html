{% extends 'base.html' %}

{% block title %}Вхід{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-box-arrow-in-right fs-1 text-primary"></i>
                    <h2 class="mt-2 mb-0">Увійти в профіль</h2>
                </div>

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_div }}
                    {% if request.GET.next %}
                    <input type="hidden" name="next" value="{{ request.GET.next }}">
                    {% endif %}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Увійти</button>
                </form>

                <p class="text-center text-muted mt-3 mb-0">
                    Ще немає акаунту?
                    <a href="{% url 'register' %}" class="text-decoration-none">Зареєструватися</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
